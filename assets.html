<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Assets</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./style.css" />

    <meta
      name="description"
      content="DFN (Decentralized Finance Network) is Complete peer to peer decentralized finance network. Provides all Banking Solutions on your fingertips."
    />
  </head>

  <body>
    <div id="loader" class="loader">
      <div class="spinner"></div>
    </div>
    <div id="navbarmenu"></div>

    <div
      class="container"
      style="
        margin-top: 60px;
        background: white;
        width: 100%;
        padding: 20px;
        padding-bottom: 100px;
      "
    >
      <div
        class="assets-rewards"
        style="
          padding: 5px;
          box-shadow: 0px 0px 12px 2px rgba(0, 0, 0, 0.1);
          border-radius: 5px;
          margin-bottom: 15px;
        "
      >
        <strong>Walllet Balance:</strong>
        <div class="coin-row">
          <div class="coin-name">
            <i class="fas fa-coins coin-icon"></i>
            <span>USDT:</span>
          </div>
          <div class="coin-balance">
            <span id="swap_usdt_balance">0 </span>
          </div>
        </div>

        <div class="coin-row">
          <div class="coin-name">
            <i class="fas fa-coins coin-icon"></i>
            <span>DFN:</span>
          </div>
          <div class="coin-balance">
            <span id="swap_dfn_balance">0 </span>
          </div>
        </div>
        <div class="button-container mt-3">
          <button
            style="width: 100%; margin-right: 5px"
            class="btn btn-outline-primary btn-lg"
            onClick="location.href='./withdrawToken.html'"
          >
            <i class="fa-solid fa-upload"></i> Send
          </button>
          <button id="receivebtn" data-toggle="modal" data-target="#myModal" style="width: 100%" class="btn btn-outline-primary btn-lg">
            <i class="fa-solid fa-download"></i> Receive
          </button>
        </div>
        <a href="./swap.html"
        ><button
          style="width: 100%"
          class="mt-3 btn btn-primary btn-lg btn-block"
        >
          <i class="fa-solid fa-repeat"></i> Swap USDT to DFN
        </button></a
      >
      </div>
      <div
        class="assets-rewards"
        style="
          padding: 5px;
          box-shadow: 0px 0px 12px 2px rgba(0, 0, 0, 0.1);
          border-radius: 5px;
          margin-bottom: 15px;
        "
      >
      
        <strong>Your Assets:</strong>

        <div class="coin-row">
          <div class="coin-name">
            <i class="fas fa-coins coin-icon"></i>
            <span>Your Staking:</span>
          </div>
          <div class="coin-balance"><span id="total_stakes">0 </span> DFN</div>
        </div>
      </div>

      <div
        class="assets-rewards"
        style="
          padding: 5px;
          box-shadow: 0px 0px 12px 2px rgba(0, 0, 0, 0.1);
          border-radius: 5px;
          margin-bottom: 15px;
        "
      >
        <strong>Your Rewards (Withdrawable):</strong>
        <div class="coin-row">
          <div class="coin-name">
            <i class="fas fa-coins coin-icon"></i>
            <span>Staking Rewards: </span>
          </div>
          <div class="coin-balance">
            <span id="realtimeReward">0 </span> DFN
          </div>
        </div>

        <div class="coin-row">
          <div class="coin-name">
            <i class="fas fa-coins coin-icon"></i>
            <span>Referral Rewards: </span>
          </div>
          <div class="coin-balance">
            <span id="referralRewards">0 </span> DFN
          </div>
        </div>

        <div class="coin-row">
          <div class="coin-name">
            <i class="fas fa-coins coin-icon"></i>
            <span>Total Rewards: </span>
          </div>
          <div class="coin-balance"><span id="totalRewards">0 </span> DFN</div>
        </div>
      </div>
      <div
        class="assets-rewards"
        style="
          padding: 5px;
          box-shadow: 0px 0px 12px 2px rgba(0, 0, 0, 0.1);
          border-radius: 5px;
          margin-bottom: 15px;
        "
      >
        <div class="coin-row">
          <div class="coin-name">
            <i class="fas fa-coins coin-icon"></i>
            <span>Rewards Withdrawn: </span>
          </div>
          <div class="coin-balance">
            <span id="rewardsWithdrawn">0 </span> DFN
          </div>
        </div>

        <div class="coin-row">
          <div class="coin-name">
            <i class="fas fa-coins coin-icon"></i>
            <span>Available Rewards: </span>
          </div>
          <div class="coin-balance">
            <span id="availableRewards">0 </span> DFN
          </div>
        </div>
        <div class="mt-1">
          <button
            onClick="location.href='./withdrawRewards.html'"
            style="margin-right: 5px;width: 100%;"
            class="btn btn-primary btn-lg"
          >
            Withdraw Reward
          </button>
         
        </div>
  
      </div>

     
   
     
    </div>


    <!-- The Modal -->
<div class="modal" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <!-- Modal Header -->
      <div class="modal-header">
       
        <span type="button" class="close" data-dismiss="modal">&times;</span>
      </div>

      <!-- Modal body -->
      <div class="modal-body">
        <div id="qrcode"></div>
      </div>

      <!-- Modal footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>

    <div id="footer-menu"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
      document.onreadystatechange = function () {
        const loader = document.getElementById("loader");
        if (document.readyState === "complete") {
          loader.style.display = "none";
        } else {
          loader.style.display = "block";
        }
      };
    </script>
    <script type="module" src="./assets.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
